<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Photography Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- TOP BAR -->
  <header>
    <span>📷</span>
    <h1>My Photography </em></h1>
   
  </header>

  <!-- SEARCH + FILTER -->
  <section class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Search images..."/>

  <div class="filters">
   
       <button class="active" data-cat="All">All</button>

    <div class="filter-box" data-cat="NATURE">
      <img src="c:\Users\Susan\Downloads\Images for website\nature.jpg.jpg" alt="Nature">
      <button>NATURE</button>
    </div>

    <div class="filter-box" data-cat="PEOPLE">
      <img src="c:\Users\Susan\Downloads\Images for website\people.jpg.jpg" alt="People">
      <button>PEOPLE</button>
    </div>

    <div class="filter-box" data-cat="CITY LIGHTS">
      <img src="c:\Users\Susan\Downloads\Images for website\city lights.jpg.jpg" alt="City Lights">
      <button>CITY LIGHTS</button>
    </div>

    <div class="filter-box" data-cat="SUNSET">
      <img src="c:\Users\Susan\Downloads\Images for website\sunset.jpg.jpg" alt="Sunset">
      <button>SUNSET</button>
    </div>

  </div>
</section>

  <!-- PHOTO GALLERY (cards added by JS) -->
  <main id="gallery"></main>

  <!-- ADD PHOTO FORM -->
  <section class="form-section">
    <div class="form-card">
      <h2>Add a New Image</h2>
      <label>Image URL</label>
      <input type="text" id="imgUrl" placeholder="https://example.com/photo.jpg"/>
      <label>Caption</label>
      <input type="text" id="imgCaption" placeholder="Enter caption"/>
      <label>Category</label>
      <select id="imgCategory">
        <option value="NATURE">NATURE</option>
        <option value="PEOPLE">PEOPLE</option>
        <option value="CITY LIGHTS">CITY LIGHTS</option>
        <option value="SUNSET">SUNSET</option>

      </select>
      <button id="addBtn">＋ Add Image</button>
    </div>
  </section>

  <!-- LIGHTBOX POPUP (hidden until a photo is clicked) -->
  <div id="lightbox">
    <button id="closeBtn">✕</button>
    <img id="lbImg" src="" alt=""/>
    <p id="lbCaption"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
